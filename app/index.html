<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1E1E1E">
  <title>Termetron</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <!-- ══ Splash：图形开场动画（`>` 描边 → 圆点 → `_` → 品牌字）══ -->
  <div id="splash" class="splash">
    <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="tmtg-splash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="tmt-grad-top"/><stop offset="1" class="tmt-grad-bot"/></linearGradient></defs><polyline class="sp-chev" pathLength="1" points="7.25,7.25 42.75,50 25.78,70.44" stroke="url(#tmtg-splash)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/><line class="sp-line" pathLength="1" x1="57.25" y1="92.75" x2="92.75" y2="92.75" stroke="#6E6E6E" stroke-width="14.5" stroke-linecap="round"/><circle class="sp-dot" cx="7.25" cy="92.75" r="7.25" fill="#6E6E6E"/></svg>
    <div class="splash-brand"><span style="animation-delay:1.60s">T</span><span style="animation-delay:1.65s">E</span><span style="animation-delay:1.70s">R</span><span style="animation-delay:1.75s">M</span><span style="animation-delay:1.80s">E</span><span style="animation-delay:1.85s">T</span><span style="animation-delay:1.90s">R</span><span style="animation-delay:1.95s">O</span><span style="animation-delay:2.00s">N</span></div>
  </div>

  <!-- ══ 顶栏：标题绝对居中，左右两侧各自放图标按钮（不会被对方挤偏）══ -->
  <header class="topbar">
    <!-- 左格：会话页显示「连接」，终端页显示「返回」 -->
    <button class="topbar-icon-btn is-leading" type="button" id="btn-conn" data-i18n-aria="aria.connection" aria-label="Connection">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
    </button>
    <button class="topbar-icon-btn is-leading" type="button" id="btn-back" data-i18n-aria="aria.back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <h1 class="topbar-title" id="topbar-title" data-i18n="page.sessions">Sessions</h1>
    <!-- 右格：新建会话（照 Scholarius 的 .page-header .icon-button）-->
    <button class="topbar-icon-btn is-trailing" type="button" id="btn-add" data-i18n-aria="aria.newSession" aria-label="New session" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </header>

  <!-- ══ 内容区 ══ -->
  <main id="content">
    <section class="page" id="page-sessions" data-page="sessions">
      <div class="empty" id="sessions-empty" hidden>
        <p class="empty-title" data-i18n="empty.noSessions">No sessions</p>
        <p class="empty-hint" data-i18n="empty.noSessionsHint">Add your computer's Tailscale IP in Settings, then tap + to start a session.</p>
      </div>
      <ul class="setting-list" id="session-list"></ul>
    </section>

    <section class="page" id="page-terminal" data-page="terminal" hidden>
      <div class="term-out" id="term-out"></div>
      <form class="term-input-row" id="term-form">
        <span class="term-prompt" id="term-prompt">$</span>
        <input class="term-input" id="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-ph="terminal.placeholder" placeholder="Run a command">
      </form>
    </section>

    <section class="page" id="page-setting" data-page="setting" hidden>
      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.general">General</h2>
        <ul class="setting-list">
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-language" aria-haspopup="menu" aria-expanded="false">
              <span class="setting-label" data-i18n="setting.language">Language</span>
              <span class="setting-value" id="setting-language-value">—</span>
            </button>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-theme" aria-haspopup="menu" aria-expanded="false">
              <span class="setting-label" data-i18n="setting.theme">Theme</span>
              <span class="setting-value" id="setting-theme-value">—</span>
            </button>
          </li>
          <li class="setting-item">
            <!-- 字号：行内只显示当前值，点开后在表单里用大小按钮与输入框调 -->
            <button class="setting-action" type="button" id="setting-fontsize" aria-haspopup="dialog">
              <span class="setting-label" data-i18n="setting.fontSize">Font Size</span>
              <span class="setting-value" id="setting-fontsize-value">—</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.connection">Connection</h2>
        <ul class="setting-list">
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-tsip">
              <span class="setting-label" data-i18n="setting.tsIp">Tailscale IP</span>
              <span class="setting-value" id="setting-tsip-value">not set</span>
            </button>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-port">
              <span class="setting-label" data-i18n="setting.port">Port</span>
              <span class="setting-value" id="setting-port-value">8899</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.about">About</h2>
        <ul class="setting-list">
          <li class="setting-item">
            <span class="setting-label" data-i18n="setting.version">Version</span>
            <span class="setting-value" id="setting-version">—</span>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-contact">
              <span class="setting-label" data-i18n="setting.contact">Contact</span>
              <span class="setting-value" id="setting-contact-value">eliaschang@163.com</span>
            </button>
          </li>
        </ul>
      </section>
    </section>
  </main>

  <!-- ══ 底部导航（严格照 Livolog：图标+名称、线性/实心切换）══ -->
  <nav class="bottom-nav" role="tablist" aria-label="Main">
    <button class="nav-item is-active" type="button" role="tab" id="tab-sessions" aria-controls="page-sessions" aria-selected="true" data-page="sessions">
      <span class="nav-icon" aria-hidden="true">
        <!-- Google Material Symbols: terminal_2 — 未选中=outlined / 选中=filled -->
        <svg class="nav-icon-outlined" viewBox="0 0 24 24" focusable="false"><path d="M20,4H4C2.89,4,2,4.9,2,6v12c0,1.1,0.89,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.11,4,20,4z M20,18H4V8h16V18z M18,17h-6v-2h6V17z M7.5,17l-1.41-1.41L8.67,13l-2.59-2.59L7.5,9l4,4L7.5,17z"/></svg>
        <svg class="nav-icon-filled" viewBox="0 0 24 24" focusable="false"><path d="M20,4H4C2.89,4,2,4.9,2,6v12c0,1.1,0.89,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.11,4,20,4z M18,17h-6v-2h6V17z M7.5,17l-1.41-1.41L8.67,13l-2.59-2.59L7.5,9l4,4L7.5,17z"/></svg>
      </span>
      <span class="nav-label" data-i18n="nav.sessions">Sessions</span>
    </button>
    <button class="nav-item" type="button" role="tab" id="tab-setting" aria-controls="page-setting" aria-selected="false" data-page="setting">
      <span class="nav-icon" aria-hidden="true">
        <svg class="nav-icon-outlined" viewBox="0 0 24 24" focusable="false"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <svg class="nav-icon-filled" viewBox="0 0 24 24" focusable="false"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </span>
      <span class="nav-label" data-i18n="nav.settings">Settings</span>
    </button>
  </nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
