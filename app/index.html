<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B1B1B">
  <title>Termetron</title>
  <style>
    /* 内置字体：与 Scholarius / Livolog **同一份** Sarasa Mono SC 子集（逐字节相同，
       只是改了族名）。两款应用的字体文件 sha256 完全一致，说明家族字体就该是它。
       授权 SIL OFL 1.1（见 fonts/LICENSE-Sarasa-OFL.txt）；做了子集化，按 OFL「修改版」处理，
       因此用自定族名，不冒用 Sarasa 的名号。字体在 public/fonts/，vite 构建后位于 www/fonts/。
       字重映射与两款应用保持一致：Regular 抵 400/500，Bold 抵 600/700。 */
    @font-face {
      font-family: 'Termetron Mono';
      src: url('/fonts/termetron-mono-regular.woff2') format('woff2');
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Termetron Mono';
      src: url('/fonts/termetron-mono-bold.woff2') format('woff2');
      font-weight: 600 700;
      font-style: normal;
      font-display: swap;
    }
    /* 与 Scholarius / Livolog 同一套中性灰阶设计语言：
       页面底 #1B1B1B / 卡片面 #242424 / 边框 #333333 / 正文 #ECECEA / 次要文字 #9A9A98 /
       强调色 = 墨白 #F2F2F0（靠反色块表达主次，不用彩色）。同步见 quant_terminal.py。 */
    :root { color-scheme: dark; --bg:#1B1B1B; --panel:#242424; --bar:#131313; --border:#333333; --txt:#ECECEA; --dim:#9A9A98; --acc:#F2F2F0; --on-acc:#1B1B1B; --danger:#E06C5E; --success:#7EE2A8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg); color: var(--txt);
      font-family: 'Termetron Mono', Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      padding: 0 24px;
    }
    .card { width: 100%; max-width: 360px; text-align: center; margin-top: -5vh; }
    /* 品牌标志：**一整行字符** `>_ TERMETRON`（用户要求）。
       ⚠️ 不要再拆成两个 span —— 拆开就要靠 gap 拼间距，字号一变、
          字体一换，`>_` 和标题之间的空隙就和字距对不上。
          写成一行字符，`>_` 后的空格就是普通字距，永远和标题一致。
       ⚠️ 用等宽字体：`>` 和 `_` 才对齐；比例字体下 `_` 会偏。
       ⚠️ 字号对齐 Scholarius 的 .page-title：17px / 700 / 0.5px / line-height 24px。 */
    .logo {
      font-family: 'Termetron Mono', 'Roboto Mono', 'Droid Sans Mono', monospace;
      font-size: 17px; font-weight: 700; letter-spacing: 0.5px; line-height: 24px;
      color: var(--acc); margin: 0 0 4px; white-space: nowrap;
    }
    .sub { color: var(--dim); font-size: 12px; margin: 0 0 28px; }
    /* ══ 表单样式：直接照搬 Scholarius ══
       ⚠️⚠️ Scholarius 的输入框是**行内无框**形态，不是卡片：
           .setting-action      border:0; background:none; padding:0
           .detail-inline-input background:transparent; border:0;
                                border-radius:0; font-size:15px; text-align:right
       它全站**没有任何带边框/圆角/卡片底的输入框**。
       之前我写 border:1px + radius:10px + --panel 底，等于凭空造了
       第三种形态 —— 这正是「表单改的还是不对」的核心。

       ⚠️ 纵向 padding 要小（Scholarius 是 0）：行高不一致会让
          「标签→输入框」的距离随行高漂移，每项看起来松紧不一。
       ⚠️ focus 不画边框、不画下划线，只把文字提亮。 */
    input {
      width: 100%; box-sizing: border-box; padding: 2px 0;
      border: 0; border-radius: 0; background: transparent; color: var(--txt);
      font-size: 15px; font-family: inherit; outline: none; min-height: 0;
      margin-bottom: 12px;
    }
    input::placeholder { color: var(--dim); opacity: 0.55; }
    input:focus { color: var(--acc); }
    /* ⚠️ 按钮也照搬 Scholarius 的 .btn：
       · 主操作（Connect）= .btn-primary → **绿色文字**、无框、无底
       · 次操作（Scan / Cancel）= .btn-ghost → 灰色文字、无框、无底
       Scholarius 的登录页就是 `btn btn-ghost` + `btn btn-primary`，
       没有「填充色块按钮」这种形态。之前的 .primary{background:--acc}
       是整个 App 里最不像 Scholarius 的地方。 */
    .btn {
      width: 100%; padding: 14px 4px; border: 0; border-radius: 0; background: none;
      font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; cursor: pointer; margin-bottom: 2px; outline: none;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 120ms ease, color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.55; }
    .btn svg { width: 16px; height: 16px; flex: none; }
    .primary { color: var(--success); }
    .ghost { color: var(--dim); }
    .primary:disabled { opacity: .5; cursor: default; }
    .hint { color: var(--dim); font-size: 11px; margin-top: 16px; line-height: 1.6; }
    .hint b { color: var(--acc); }
    .ver { color: var(--dim); font-size: 11px; position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; line-height: 1.6; margin: 0; }
    .ver b { color: var(--acc); }
    /* ══ Splash 开场动画 ══
       时间轴（总 2.9s，之后整体淡出）：
         0.00–0.85s  `>` 从左上门起点沿路径画到末端（stroke-dasharray）
         0.85–1.10s  尾部孤立圆点淡入 + 放大
         1.10–1.55s  `_` 从左到右画出
         1.60–2.10s  TERMETRON 逐字浮现
         2.10–2.90s  静置
         2.90–3.40s  整体淡出
       ⚠️ 用 stroke-dasharray/dashoffset 画路径，**不要**用 width/clip：
          clip 会把圆头（stroke-linecap:round）切成平头，动画中间很难看。
          dasharray 长度必须 ≥ 实际路径长，否则末尾会提前露出。
          实测：polyline 82.135，line 35.5 —— 这里都取多 1 防止浮点误差。
       ⚠️ 圆点用 scale 从 0 起：它不是路径，只能靠透明度 + 缩放「浮现」。 */
    .splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 6vh; z-index: 99999; animation: ut-splash 3.4s ease forwards; pointer-events: none; }
    @keyframes ut-splash { 0%, 85.3% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
    .splash svg { width: 108px; height: 108px; color: var(--acc); overflow: visible; }

    /* ⚠️ keyframes **必须同时写 from 和 to**：
       只写 `to {}` 时，部分 WebView 不对 SVG 的 stroke-dashoffset 建立
       插值基准 —— 实测动画 state 是 running、currentTime 恒为 0、
       dashoffset 一直是起始值（看起来「完全没动」）。
       手动 `style.strokeDashoffset='40'` 却能生效，说明属性本身可动画，
       问题就在 keyframes 缺起点。
    ⚠️ 用 `pathLength="1"` 把路径长度归一化成 1：
       这样 dasharray/dashoffset 都写 1，**不用**把两条路径的真实长度
       （82.13 / 35.5）硬编码进 CSS。以后改几何不用同步改数字。 */
    .sp-fade { animation: sp-draw 0.85s cubic-bezier(.4,0,.2,1) 0.05s forwards; }
    @keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    /* `>` 折线：从起点画到末端 */
    .sp-chev { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 0.85s cubic-bezier(.4,0,.2,1) 0.05s forwards; }
    /* 尾部孤立圆点：画完 `>` 之后浮现 */
    .sp-dot { opacity: 0; transform: scale(0); transform-origin: 7.25px 92.75px; animation: sp-pop 0.28s cubic-bezier(.34,1.56,.64,1) 0.85s forwards; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    /* `_` 从左到右画出 */
    .sp-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 0.45s cubic-bezier(.4,0,.2,1) 1.10s forwards; }
    /* 品牌字：逐个字母浮现 */
    .splash-brand { color: var(--acc); font-family: inherit; font-size: 24px; font-weight: 700; letter-spacing: 7px; display: flex; }
    .splash-brand span { opacity: 0; transform: translateY(6px); animation: sp-char 0.34s ease-out forwards; }
    @keyframes sp-char { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    /* ⚠️ 尊重系统「减少动态效果」：直接显示终态，只保留淡出 */
    @media (prefers-reduced-motion: reduce) {
      .sp-chev, .sp-line { stroke-dashoffset: 0; animation: none; }
      .sp-dot { opacity: 1; transform: none; animation: none; }
      .splash-brand span { opacity: 1; transform: none; animation: none; }
      .splash { animation: ut-splash 2.0s ease forwards; }
    }
    /* logo 的几何直接内联在 <svg> 里（与图标同一套坐标），不再用 <text> 画字形。 */
    /* 终端标志的渐变：白 → 灰，与 App 图标（generate-icons.py）完全一致。
       ⚠️ 不要退回 currentColor 纯色：图标是白→灰渐变，网页 logo 纯白会与图标对不上。
       ⚠️ 这里的几何必须与 generate-icons.py 的输出一一对应（归一化到占位框）：
            线宽 0.1056、起点(0.053,0.053)、折点(0.447,0.5)、末端(0.193,0.789)
            圆点(0.053,0.947) r=0.053、下划线 (0.553,0.947)-(0.947,0.947)
          改图标参数时，这四处 SVG（index.html 两个 + quant_terminal.py 两个）必须同步。
       ⚠️ 不要退回「外层圆角矩形框 + <text>>_</text>」的旧画法：
          图标早已去掉外框，而且字体笔画粗细与图标线宽无关。 */
    .tmt-grad-top { stop-color: #FFFFFF; }
    .tmt-grad-bot { stop-color: #6E6E6E; }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="tmtg-splash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="tmt-grad-top"/><stop offset="1" class="tmt-grad-bot"/></linearGradient></defs><polyline class="sp-chev" pathLength="1" points="7.25,7.25 42.75,50 25.78,70.44" stroke="url(#tmtg-splash)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/><line class="sp-line" pathLength="1" x1="57.25" y1="92.75" x2="92.75" y2="92.75" stroke="#6E6E6E" stroke-width="14.5" stroke-linecap="round"/><circle class="sp-dot" cx="7.25" cy="92.75" r="7.25" fill="#6E6E6E"/></svg>
    <div class="splash-brand"><span style="animation-delay:1.60s">T</span><span style="animation-delay:1.65s">E</span><span style="animation-delay:1.70s">R</span><span style="animation-delay:1.75s">M</span><span style="animation-delay:1.80s">E</span><span style="animation-delay:1.85s">T</span><span style="animation-delay:1.90s">R</span><span style="animation-delay:1.95s">O</span><span style="animation-delay:2.00s">N</span></div>
  </div>
  <div class="card">
    <p class="logo">&gt;_ TERMETRON</p>
    <p class="sub">Mobile Client</p>
    <input id="url" placeholder="paste tunnel URL from computer" autocomplete="off">
    <button class="btn primary" id="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Connect</button>
    <button class="btn ghost" id="scan">Scan QR Code</button>
    <p class="hint">
      On the computer run <b>termetron remote on</b>, then either paste the URL or scan the QR.
      Enter the one-time password, then enter the 4-digit code on the computer to pair.
    </p>
    <p class="ver" id="ver"></p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
