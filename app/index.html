<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B1B1B">
  <title>Termetron</title>
  <style>
    /* 内置字体：与 Scholarius / Livolog **同一份** Sarasa Mono SC 子集（逐字节相同，
       只是改了族名）。两款应用的字体文件 sha256 完全一致，说明家族字体就该是它。
       授权 SIL OFL 1.1（见 fonts/LICENSE-Sarasa-OFL.txt）；做了子集化，按 OFL「修改版」处理，
       因此用自定族名，不冒用 Sarasa 的名号。字体在 public/fonts/，vite 构建后位于 www/fonts/。
       字重映射与两款应用保持一致：Regular 抵 400/500，Bold 抵 600/700。 */
    @font-face {
      font-family: 'Termetron Mono';
      src: url('/fonts/termetron-mono-regular.woff2') format('woff2');
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Termetron Mono';
      src: url('/fonts/termetron-mono-bold.woff2') format('woff2');
      font-weight: 600 700;
      font-style: normal;
      font-display: swap;
    }
    /* 与 Scholarius / Livolog 同一套中性灰阶设计语言：
       页面底 #1B1B1B / 卡片面 #242424 / 边框 #333333 / 正文 #ECECEA / 次要文字 #9A9A98 /
       强调色 = 墨白 #F2F2F0（靠反色块表达主次，不用彩色）。同步见 quant_terminal.py。 */
    :root { color-scheme: dark; --bg:#1B1B1B; --panel:#242424; --bar:#131313; --border:#333333; --txt:#ECECEA; --dim:#9A9A98; --acc:#F2F2F0; --on-acc:#1B1B1B; --danger:#E06C5E; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg); color: var(--txt);
      font-family: 'Termetron Mono', Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      padding: 0 24px;
    }
    .card { width: 100%; max-width: 360px; text-align: center; margin-top: -5vh; }
    .logo { display: inline-flex; align-items: center; gap: 14px; color: var(--acc); margin: 0 0 4px; }
    .logo svg { width: 38px; height: 38px; flex: none; }
    /* ⚠️ 品牌标题也用等宽字体：Scholarius / Livolog 的 header 标题
       （.page-title 17px/700/uppercase）用的是同一个 family，没有另开一个
       无衬线品牌字体。之前用 'Segoe UI' 800，与两款应用明显不是一套。 */
    .logo .ttl { font-family: inherit; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
    .sub { color: var(--dim); font-size: 12px; margin: 0 0 28px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--txt); font-size: 14px; outline: none; margin-bottom: 10px;
    }
    input:focus { border-color: var(--acc); }
    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px;
      font-weight: 600; cursor: pointer; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn svg { width: 16px; height: 16px; flex: none; }
    .primary { background: var(--acc); color: var(--on-acc); }
    .ghost { background: var(--panel); color: var(--txt); border: 1px solid var(--border); }
    .primary:disabled { opacity: .6; cursor: default; }
    button:focus { outline: none; box-shadow: 0 0 0 2px rgba(242,242,240,.3); }
    .hint { color: var(--dim); font-size: 11px; margin-top: 16px; line-height: 1.6; }
    .hint b { color: var(--acc); }
    .ver { color: var(--dim); font-size: 11px; position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; line-height: 1.6; margin: 0; }
    .ver b { color: var(--acc); }
    .splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 6vh; z-index: 99999; animation: ut-splash 2.6s ease forwards; pointer-events: none; }
    @keyframes ut-splash { 0%, 77% { opacity: 1; } 100% { opacity: 0; } }
    .splash svg { width: 108px; height: 108px; color: var(--acc); }
    .splash-brand { color: var(--acc); font-family: inherit; font-size: 24px; font-weight: 700; letter-spacing: 7px; }
    /* logo 的几何直接内联在 <svg> 里（与图标同一套坐标），不再用 <text> 画字形。 */
    /* 终端标志的渐变：白 → 灰，与 App 图标（generate-icons.py）完全一致。
       ⚠️ 不要退回 currentColor 纯色：图标是白→灰渐变，网页 logo 纯白会与图标对不上。
       ⚠️ 这里的几何必须与 generate-icons.py 的输出一一对应（归一化到占位框）：
            线宽 0.1056、起点(0.053,0.053)、折点(0.447,0.5)、末端(0.193,0.789)
            圆点(0.053,0.947) r=0.053、下划线 (0.553,0.947)-(0.947,0.947)
          改图标参数时，这四处 SVG（index.html 两个 + quant_terminal.py 两个）必须同步。
       ⚠️ 不要退回「外层圆角矩形框 + <text>>_</text>」的旧画法：
          图标早已去掉外框，而且字体笔画粗细与图标线宽无关。 */
    .tmt-grad-top { stop-color: #FFFFFF; }
    .tmt-grad-bot { stop-color: #6E6E6E; }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="tmtg-splash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="tmt-grad-top"/><stop offset="1" class="tmt-grad-bot"/></linearGradient></defs><polyline points="7.25,7.25 42.75,50 25.78,70.44" stroke="url(#tmtg-splash)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="57.25" y1="92.75" x2="92.75" y2="92.75" stroke="#6E6E6E" stroke-width="14.5" stroke-linecap="round"/><circle cx="7.25" cy="92.75" r="7.25" fill="#6E6E6E"/></svg>
    <div class="splash-brand">TERMETRON</div>
  </div>
  <div class="card">
    <p class="logo">
      <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="tmtg-logo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="tmt-grad-top"/><stop offset="1" class="tmt-grad-bot"/></linearGradient></defs><polyline points="7.25,7.25 42.75,50 25.78,70.44" stroke="url(#tmtg-logo)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="57.25" y1="92.75" x2="92.75" y2="92.75" stroke="#6E6E6E" stroke-width="14.5" stroke-linecap="round"/><circle cx="7.25" cy="92.75" r="7.25" fill="#6E6E6E"/></svg>
      <span class="ttl">TERMETRON</span>
    </p>
    <p class="sub">Mobile Client</p>
    <input id="url" placeholder="paste tunnel URL from computer" autocomplete="off">
    <button class="btn primary" id="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Connect</button>
    <button class="btn ghost" id="scan">Scan QR Code</button>
    <p class="hint">
      On the computer run <b>termetron remote on</b>, then either paste the URL or scan the QR.
      Enter the one-time password, then enter the 4-digit code on the computer to pair.
    </p>
    <p class="ver" id="ver"></p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
