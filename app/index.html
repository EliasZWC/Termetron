<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1E1E1E">
  <title>Termetron</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <!-- ══ Splash：图形开场动画（`>` 描边 → 圆点 → `_` → 品牌字）══ -->
  <div id="splash" class="splash">
    <svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="tmtg-splash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="tmt-grad-top"/><stop offset="1" class="tmt-grad-bot"/></linearGradient></defs><polyline class="sp-chev" pathLength="1" points="7.25,7.25 42.75,50 25.78,70.44" stroke="url(#tmtg-splash)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/><line class="sp-line" pathLength="1" x1="57.25" y1="92.75" x2="92.75" y2="92.75" stroke="#6E6E6E" stroke-width="14.5" stroke-linecap="round"/><circle class="sp-dot" cx="7.25" cy="92.75" r="7.25" fill="#6E6E6E"/></svg>
    <div class="splash-brand"><span style="animation-delay:1.60s">T</span><span style="animation-delay:1.65s">E</span><span style="animation-delay:1.70s">R</span><span style="animation-delay:1.75s">M</span><span style="animation-delay:1.80s">E</span><span style="animation-delay:1.85s">T</span><span style="animation-delay:1.90s">R</span><span style="animation-delay:1.95s">O</span><span style="animation-delay:2.00s">N</span></div>
  </div>

  <!-- ══ 批量选择操作栏（对齐 Livolog 的 .selection-bar）══
       长按任意会话行进入多选后，这条从上方滑入**盖住标题栏**。
       ⚠️ 必须是 <header> 的**同级兄弟**，不能放进 header 里面 ——
          放进去会把 topbar 和后面的 main 都变成它的子元素，flex 布局
          整体塌掉（实测：content 高度只剩 84px、y=-14，列表跑到屏幕外）。
       三段布局：左=关闭，中=已选数量，右=全选 + 删除（红）。 -->
  <div class="selection-bar" id="selection-bar" hidden>
    <button class="topbar-icon-btn" type="button" id="btn-bulk-done" data-i18n-aria="aria.bulkExit" aria-label="Exit selection mode">
      <!-- Material Symbols: close -->
      <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M256-200 200-256l224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
    </button>
    <span class="selection-count" id="selection-count"></span>
    <div class="selection-actions">
      <button class="topbar-icon-btn" type="button" id="btn-bulk-all" data-i18n-aria="bulk.selectAll" aria-label="Select all">
        <!-- Material Symbols: select_all -->
        <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M280-280v-400h400v400H280Zm80-80h240v-240H360v240ZM120-120v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80Zm160 640v-80h80v80h-80Zm160 0v-80h80v80h-80Zm160 0v-80h80v80h-80Zm160 0v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80Zm0-160v-80h80v80h-80ZM120-760v-80h400v80H120Zm160 160v-80h80v80h-80Zm160 0v-80h80v80h-80Zm160 0v-80h80v80h-80Z"/></svg>
      </button>
      <button class="topbar-icon-btn is-danger" type="button" id="btn-bulk-delete" data-i18n-aria="bulk.delete" aria-label="Delete">
        <!-- Material Symbols: delete -->
        <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360Z"/></svg>
      </button>
    </div>
  </div>

  <header class="topbar">
    <button class="topbar-icon-btn is-leading" type="button" id="btn-conn" data-i18n-aria="aria.connect" aria-label="Connect">
      <!-- Material Symbols: link -->
      <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M440-280H280q-83 0-141.5-58.5T80-480q0-83 58.5-141.5T280-680h160v80H280q-50 0-85 35t-35 85q0 50 35 85t85 35h160v80ZM320-440v-80h320v80H320Zm200 160v-80h160q50 0 85-35t35-85q0-50-35-85t-85-35H520v-80h160q83 0 141.5 58.5T880-480q0 83-58.5 141.5T680-280H520Z"/></svg>
    </button>
    <button class="topbar-icon-btn is-leading" type="button" id="btn-back" data-i18n-aria="aria.back" aria-label="Back" hidden>
      <!-- Material Symbols: arrow_back -->
      <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z"/></svg>
    </button>
    <h1 class="topbar-title" id="topbar-title" data-i18n="page.sessions">Session</h1>
    <!-- 右格：终端页显示「复制 + 中断」，会话页显示「新建」。
         中断按钮原本在输出区底部，会占掉一行高度、还挡住内容；
         它是终端的核心操作，放标题栏更符合"随时可及"的语义。
         ⚠️ DOM 顺序 = 显示顺序：复制在左、中断在右（最靠近屏幕边缘的是
            中断，拇指最容易够到）。
         ⚠️ 用容器 + gap 而不是给按钮加 margin：只有容器负责「推到最右」，
            按钮自己不管位置，两个按钮的间距就是 gap 一个值。 -->
    <div class="topbar-actions">
      <button class="topbar-icon-btn" type="button" id="btn-term-ctrlc" data-i18n-aria="aria.interrupt" aria-label="Interrupt (Ctrl+C)" hidden>
        <!-- Material Symbols: stop_circle -->
        <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M320-320h320v-320H320v320ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
      </button>
      <!-- 新建会话（照 Scholarius 的 .page-header .icon-button）-->
      <button class="topbar-icon-btn" type="button" id="btn-add" data-i18n-aria="aria.newSession" aria-label="New session" hidden>
        <!-- Material Symbols: add -->
        <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
      </button>
      <!-- 会话菜单（仅终端页）：重命名 / 删除 / 查看信息 -->
      <button class="topbar-icon-btn" type="button" id="btn-term-menu" data-i18n-aria="aria.sessionMenu" aria-label="Session menu" hidden>
        <!-- Material Symbols: more_vert -->
        <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z"/></svg>
      </button>
    </div>
  </header>

  <!-- ══ 内容区 ══ -->
  <main id="content">
    <section class="page" id="page-sessions" data-page="sessions">
      <div class="empty" id="sessions-empty" hidden>
        <p class="empty-title" data-i18n="empty.noSessions">No Session</p>
        <p class="empty-hint" data-i18n="empty.noSessionsHint">Tap + in the top right to start one.</p>
      </div>
      <!-- 会话列表：列表式，行间 1px 分隔线（见 .session-row 的 border-top） -->
      <ul class="setting-list" id="session-list"></ul>
    </section>

    <section class="page" id="page-terminal" data-page="terminal" hidden>
      <!-- 输出区。
           ⚠️ 提示符必须放在**输出区末尾**（真终端就是这样：最后一行是
              `E:\product\Termetron>`）。放在下面的输入栏里会被输入框挤掉、
              路径一长就看不见了 —— 用户明确要求“输入栏只管输入，不能隐藏提示符”。 -->
      <div class="term-out" id="term-out"></div>
      <!-- 提示符条：始终可见，显示当前会话的绝对路径 -->
      <div class="term-prompt-bar" id="term-prompt-bar">
        <span class="term-prompt" id="term-prompt">$</span>
      </div>
      <form class="term-input-row" id="term-form">
        <input class="term-input" id="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-ph="terminal.placeholder" placeholder="Run a command">
      </form>
    </section>

    <section class="page" id="page-setting" data-page="setting" hidden>
      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.general">General</h2>
        <ul class="setting-list">
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-language" aria-haspopup="menu" aria-expanded="false">
              <span class="setting-label" data-i18n="setting.language">Language</span>
              <span class="setting-value" id="setting-language-value">—</span>
            </button>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-theme" aria-haspopup="menu" aria-expanded="false">
              <span class="setting-label" data-i18n="setting.theme">Theme</span>
              <span class="setting-value" id="setting-theme-value">—</span>
            </button>
          </li>
          <li class="setting-item">
            <!-- 字号：行内只显示当前值，点开后在表单里用大小按钮与输入框调 -->
            <button class="setting-action" type="button" id="setting-fontsize" aria-haspopup="dialog">
              <span class="setting-label" data-i18n="setting.fontSize">Font Size</span>
              <span class="setting-value" id="setting-fontsize-value">—</span>
            </button>
          </li>
        </ul>
      </section>

      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.connection">Connection</h2>
        <ul class="setting-list">
          <!-- 隧道码 + 密码是**身份**（长期不变）；地址是**传输**（会变）。
               顺序也照这个语义排：先身份，后地址。 -->
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-tunnel-code">
              <span class="setting-label" data-i18n="conn.code">Tunnel Code</span>
              <span class="setting-value" id="setting-tunnel-code-value">not set</span>
            </button>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-tunnel-pass">
              <span class="setting-label" data-i18n="conn.password">Password</span>
              <span class="setting-value" id="setting-tunnel-pass-value">not set</span>
            </button>
          </li>
          <li class="setting-item">
            <!-- 地址是**传输层**，不是用户配置项：隧道重建后 URL 会变，
                 由顶栏「刷新」按隧道码自动发现并改写。
                 这里只展示当前实际连着的地址，不可编辑 ——
                 能改就会变成「套壳一个固定域名」，绕开了隧道码这个根。 -->
            <span class="setting-label" data-i18n="conn.address">Address</span>
            <span class="setting-value" id="setting-tsip-value">not set</span>
          </li>
        </ul>
      </section>

      <section class="setting-group">
        <h2 class="setting-group-title" data-i18n="group.about">About</h2>
        <ul class="setting-list">
          <li class="setting-item">
            <span class="setting-label" data-i18n="setting.version">Version</span>
            <span class="setting-value" id="setting-version">—</span>
          </li>
          <li class="setting-item">
            <button class="setting-action" type="button" id="setting-contact">
              <span class="setting-label" data-i18n="setting.contact">Contact</span>
              <span class="setting-value" id="setting-contact-value">eliaschang@163.com</span>
            </button>
          </li>
        </ul>
      </section>
    </section>
  </main>

  <!-- ══ 底部导航（照 Livolog：图标+名称、线性/实心切换）══
       ⚠️ 图标一律用 **Google Material Symbols 官方 path**，不要手绘。
          拿不准时从 https://fonts.google.com/icons 复制 SVG。
       ⚠️ Material Symbols 的 FILL 是可变轴：同一组 path 数据，
          fill:currentColor 就是实心，fill:none + stroke 才是描边。
          但**并非每个图标都有描边变体** —— 例如 terminal_2 的
          outlined 与 filled 路径**完全相同**（它本身就是纯笔画面），
          用 fill 渲染就是实心块。这类图标只能用官方 outlined 的原始
          渲染方式（fill），不能自己画几条线来"假装线性"。
          所以导航栏用 terminal（有真正的描边/实心两种官方数据）。 -->
  <nav class="bottom-nav" role="tablist" aria-label="Main">
    <button class="nav-item is-active" type="button" role="tab" id="tab-sessions" aria-controls="page-sessions" aria-selected="true" data-page="sessions">
      <span class="nav-icon" aria-hidden="true">
        <!-- Material Symbols: terminal（outlined） -->
        <svg class="nav-icon-outlined" viewBox="0 -960 960 960" focusable="false"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm0-80h640v-480H160v480Zm146-67-57-57 76-76-76-76 57-57 133 133-133 133Zm174-13h200v-80H480v80Z"/></svg>
        <!-- Material Symbols: terminal（filled） -->
        <svg class="nav-icon-filled" viewBox="0 -960 960 960" focusable="false"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm146-147 133-133-133-133-57 57 76 76-76 76 57 57Zm174-13h200v-80H480v80Z"/></svg>
      </span>
      <span class="nav-label" data-i18n="nav.sessions">Session</span>
    </button>
    <button class="nav-item" type="button" role="tab" id="tab-setting" aria-controls="page-setting" aria-selected="false" data-page="setting">
      <span class="nav-icon" aria-hidden="true">
        <!-- Material Symbols: settings（outlined） -->
        <svg class="nav-icon-outlined" viewBox="0 -960 960 960" focusable="false"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
        <!-- Material Symbols: settings（filled） -->
        <svg class="nav-icon-filled" viewBox="0 -960 960 960" focusable="false"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"/></svg>
      </span>
      <span class="nav-label" data-i18n="nav.settings">Setting</span>
    </button>
  </nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
