name: build-apk

# 云端构建 Android APK（无需本地 Node/JDK/Android SDK）
# 仓库需 public：构建后发布 GitHub Release（tag=v<version>，附件=APK），
# 作为 App 内自动更新的更新源（App 查 /releases/latest）。
# 版本号未变时 tag 已存在，gh release 失败被容忍（跳过发布）。
on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [main]

permissions:
  contents: write              # 发布 GitHub Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Build web (vite -> www)
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android project (OutSystems repo + minSdk 26 + apk install)
        run: python3 scripts/patch-android.py

      - name: Build APK (gradle)
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (App update source)
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "termetron-v${VER}.apk"
          gh release create "v${VER}" "termetron-v${VER}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Termetron v${VER}" \
            --generate-notes \
            || echo "::notice title=release::v${VER} already exists, skip"
