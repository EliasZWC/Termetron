name: build-apk

# 云端构建 Android APK（无需本地 Node/JDK/Android SDK）
on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [main]
    paths: ['lib/qt/app/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/qt/app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Build web (vite -> www)
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (gradle)
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qt-apk
          path: lib/qt/app/android/app/build/outputs/apk/debug/app-debug.apk
