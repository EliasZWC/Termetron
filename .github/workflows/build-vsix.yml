name: build-vsix

# 云构建 VS Code 扩展（.vsix）：无需本地 Node。
# push 到 vscode/** 或 quant_terminal.py（服务端改动会随 copy-server 打进 vsix）时
# 自动构建 + 发布 Marketplace：
#   - 需要仓库 secret VSCE_PAT（Azure DevOps PAT，Marketplace Manage 权限）
#   - 发布前自动查询线上版本，与本地相同则跳过（日常 commit 版本不变不重复发版）
#   - 未配置 VSCE_PAT 时只构建/上传 artifact，不发布（不失败）

on:
  workflow_dispatch:
  push:
    paths:
      - 'vscode/**'
      - 'quant_terminal.py'
      - '.github/workflows/build-vsix.yml'
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: vscode
        run: npm install

      - name: Compile
        working-directory: vscode
        run: npm run compile

      - name: Package vsix
        working-directory: vscode
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: termetron-vsix
          path: vscode/*.vsix

      - name: Check if version already published
        id: check
        working-directory: vscode
        run: |
          VER=$(node -p "require('./package.json').version")
          PUB=$(curl -s -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"EliasZhang.termetron\"}],\"pageNumber\":1,\"pageSize\":10}],\"flags\":914}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const e=j.results&&j.results[0].extensions&&j.results[0].extensions[0];console.log(e&&e.versions&&e.versions[0]?e.versions[0].version:'')}catch(err){console.log('')}})")
          echo "local=$VER published=$PUB"
          if [ "$VER" = "$PUB" ]; then echo "skip=yes"; else echo "skip=no"; fi
          echo "skip=$([ \"$VER\" = \"$PUB\" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish to Marketplace
        if: steps.check.outputs.skip != 'yes' && env.VSCE_PAT != ''
        working-directory: vscode
        run: npx @vscode/vsce publish --packagePath $(ls termetron-*.vsix)
