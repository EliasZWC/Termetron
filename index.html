<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>Termetron</title>
  <style>
    /* 与电脑端 quant_terminal.py 一致的主题：--bg #0a0e14 / --panel #0d131b / --bar #171e2b / --border #1b2733 / --txt #c9d1d9 / --dim #5a6a7a / --acc #a78bfa */
    :root { color-scheme: dark; --bg:#0a0e14; --panel:#0d131b; --bar:#171e2b; --border:#1b2733; --txt:#c9d1d9; --dim:#5a6a7a; --acc:#a78bfa; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif;
      padding: 24px;
    }
    .card { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; min-height: min(540px, 78vh); }
    .logo { display: inline-flex; align-items: center; gap: 14px; color: var(--acc); margin: 0 0 4px; }
    .logo svg { width: 38px; height: 38px; flex: none; }
    .logo svg * { stroke-width: 2.6; }
    .logo .ttl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 3px; }
    .sub { color: var(--dim); font-size: 12px; margin: 0 0 28px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--txt); font-size: 14px; outline: none; margin-bottom: 10px;
    }
    input:focus { border-color: var(--acc); }
    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px;
      font-weight: 600; cursor: pointer; margin-bottom: 10px;
    }
    .primary { background: var(--acc); color: var(--bg); }
    .ghost { background: var(--panel); color: var(--txt); border: 1px solid var(--border); }
    .primary:disabled { opacity: .6; cursor: default; }
    button:focus { outline: none; box-shadow: 0 0 0 2px rgba(167,139,250,.3); }
    .hint { color: var(--dim); font-size: 11px; margin-top: 16px; line-height: 1.6; }
    .hint b { color: var(--acc); }
    .ver { color: var(--dim); font-size: 11px; margin-top: auto; padding: 52px 0 8px; line-height: 1.6; }
    .ver b { color: var(--acc); }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="1.5" y="2" width="21" height="20" rx="4" fill="none" stroke="currentColor" style="stroke-width:1.6"></rect><text x="3.5" y="13" font-family="Consolas,Menlo,monospace" font-size="11.5" font-weight="700" fill="currentColor">>_</text></svg>
      <span class="ttl">TERMETRON</span>
    </p>
    <p class="sub">mobile client</p>
    <input id="url" placeholder="paste tunnel URL from computer" autocomplete="off">
    <button class="btn primary" id="connect">connect</button>
    <button class="btn ghost" id="scan">scan QR code</button>
    <p class="hint">
      On the computer run <b>termetron remote on</b>, then either paste the URL or scan the QR.
      You'll enter the one-time password and approve the pairing with <b>termetron allow &lt;key&gt;</b>.
    </p>
    <p class="ver" id="ver"></p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
